<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>对局 · 游戏中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%E2%99%9F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./app.css?v=k1">
  <link rel="stylesheet" href="./games/doudizhu/table.css?v=k1">
  <script>
    /* 主题跟随 KiraAI WebUI（本页不提供独立切换），与宿主 stores/app.ts 同一口径：
       localStorage["theme"]（"light"|"dark"）→ documentElement 上的 dark 类；
       prefers-color-scheme 兜底。storage 事件（e.key === "theme"）即时同步。 */
    (function () {
      function apply(t) {
        document.documentElement.classList.toggle("dark", t === "dark");
      }
      function detect() {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
          catch (e) { t = "light"; }
        }
        apply(t);
      }
      detect();
      addEventListener("storage", function (e) {
        if (!e.key || e.key === "theme") detect();
      });
    })();
  </script>
</head>
<body>
  <main class="match">
    <header class="topbar reveal">
      <a class="btn ghost back" href="./index.html">← 大厅</a>
      <div class="title-wrap">
        <h1 id="m-title">对局</h1>
        <p id="m-sub" class="match-sub"></p>
      </div>
      <div class="top-right">
        <span id="spectate-chip" class="pill accent hidden">观战中</span>
        <span id="conn-chip" class="conn-chip loading"><i class="dot"></i><span id="conn-label">连接中…</span></span>
      </div>
    </header>

    <div id="recon-banner" class="recon hidden" aria-live="polite"></div>

    <section class="stage" aria-label="棋桌">
      <div id="seats" class="seats reveal" aria-label="座位"></div>
      <div id="mate-zone" class="mate-zone hidden" aria-label="队友区"></div>
      <div id="board-shell" class="board-shell reveal">
        <div id="board-skel" class="board-skel skel" aria-hidden="true"></div>
        <div id="sticker-slot"></div>
      </div>
      <div id="board-meta" class="board-meta hidden" aria-label="棋局信息"></div>
      <p id="status-line" class="status-line k-wait" aria-live="polite">正在进入棋局…</p>
      <div id="level-row" class="level-row hidden" role="group" aria-label="对手等级"></div>
      <div id="chat-status" class="chat-status hidden" role="status"></div>
      <div id="chat-readonly" class="chat-readonly hidden" role="status"></div>
      <div id="actions" class="action-row reveal"></div>
      <div id="chat-dock" class="chat-dock"></div>
    </section>

    <aside class="side-col reveal" aria-label="对局侧栏">
      <section class="log-panel" aria-label="对局记录">
        <div class="log-head">对局记录</div>
        <ol id="log-list" class="log-list"></ol>
      </section>
      <div id="side-chat" class="side-chat"></div>
    </aside>
  </main>

  <script type="module" src="./match.js?v=k1"></script>
</body>
</html>
